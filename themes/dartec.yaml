---
# The Dartec Smart Homes themes for Home Assistant.
#
#   Dartec           the house theme: teal on warm cream and paper.
#   Dartec Graphite  quiet neutral surfaces, teal only where something is on.
#                    The panel and night theme.
#
# Homes store their default theme by name, so these names never change. Both
# themes set light and dark in full, use theme variables only (no card-mod, no
# JavaScript, no images), and pass WCAG AA in both modes: see
# scripts/contrast.py. Copper is not used: the brand reserves it for content
# written by AI.
#
# Fonts: 'Dartec Lateef' (Arabic only) and 'Dartec Plex Mono' render only where
# a page loads them (kaboomAE/dartec-ha-manager#59). Latin text is Roboto, which
# Home Assistant ships itself; until Lateef loads, Arabic uses the device's own
# font. Dubai, the brand's Latin face, is not named: its licence does not allow
# it to be redistributed.

# ── Dartec ───────────────────────────────────────────────────────────────────
Dartec:
  primary-color: "#1a6b6b"
  accent-color: "#1a6b6b"
  dark-primary-color: "#0f4f4f"
  light-primary-color: "#e6f0f0"

  # Type (Home Assistant 2025.5 and later read these, not paper-font-*)
  ha-font-family-body: "'Dartec Lateef', Roboto, Noto, system-ui, sans-serif"
  ha-font-family-heading: "'Dartec Lateef', Roboto, Noto, system-ui, sans-serif"
  ha-font-family-code: "'Dartec Plex Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace"

  # Shape: tight radii, matching the Dartec system
  ha-card-border-radius: "8px"
  ha-dialog-border-radius: "10px"

  modes:
    light:
      primary-background-color: "#f5f5f0"      # cream
      secondary-background-color: "#ebe9df"    # cream dim
      card-background-color: "#fffdf8"         # paper
      primary-text-color: "#22251f"            # ink
      secondary-text-color: "#52564c"          # ink soft
      disabled-text-color: "#666a5c"
      divider-color: "#ddd6c4"                 # tan
      ha-card-border-color: "#ddd6c4"
      primary-color: "#1a6b6b"                 # teal
      accent-color: "#1a6b6b"
      text-primary-color: "#ffffff"            # text on teal
      state-active-color: "#1a6b6b"
      state-icon-color: "#1a6b6b"
      state-climate-cool-color: "#1a6b6b"
      state-climate-dry-color: "#8a6a12"
      state-climate-fan_only-color: "#0f4f4f"
      state-light-on-color: "#a88400"          # gold, never copper
      state-switch-on-color: "#1a6b6b"
      state-cover-active-color: "#1a6b6b"
      slider-track-color: "#ddd6c4"
      error-color: "#dc2626"
      warning-color: "#d97706"
      success-color: "#047857"
      info-color: "#1a6b6b"
      table-row-background-color: "#fffdf8"
      table-row-alternative-background-color: "#f5f5f0"
      sidebar-background-color: "#fffdf8"
      sidebar-selected-icon-color: "#1a6b6b"
      sidebar-selected-text-color: "#1a6b6b"

    dark:
      primary-background-color: "#17181a"      # dark ground
      secondary-background-color: "#212328"
      card-background-color: "#1e2024"
      primary-text-color: "#e8e6df"
      secondary-text-color: "#a8a79e"
      disabled-text-color: "#85857c"
      divider-color: "#3a3a38"
      ha-card-border-color: "#3a3a38"
      primary-color: "#4db3ac"                 # teal, lifted for dark
      accent-color: "#4db3ac"
      text-primary-color: "#17181a"            # text on light teal: ink, not white
      state-active-color: "#4db3ac"
      state-icon-color: "#4db3ac"
      state-climate-cool-color: "#4db3ac"
      state-climate-dry-color: "#d9b44a"
      state-climate-fan_only-color: "#7fd0c9"
      state-light-on-color: "#facc15"
      state-switch-on-color: "#4db3ac"
      state-cover-active-color: "#4db3ac"
      slider-track-color: "#3a3a38"
      error-color: "#f87171"
      warning-color: "#fbbf24"
      success-color: "#34d399"
      info-color: "#4db3ac"
      table-row-background-color: "#1e2024"
      table-row-alternative-background-color: "#212328"
      sidebar-background-color: "#1e2024"
      sidebar-selected-icon-color: "#4db3ac"
      sidebar-selected-text-color: "#7fd0c9"
      code-editor-background-color: "#17181a"

# ── Dartec Graphite ──────────────────────────────────────────────────────────
# Grey icons while a device is off, teal only when it is on, so a dark bedroom
# panel shows colour only where something is running. The night theme.
Dartec Graphite:
