      card-background-color: "#1b1c1e"
      ha-card-border-color: "#2b2d30"
      primary-text-color: "#e4e3df"
      secondary-text-color: "#a3a4a1"
      disabled-text-color: "#7f807d"
      divider-color: "#2b2d30"
      primary-color: "#5fb8b1"
      accent-color: "#5fb8b1"
      text-primary-color: "#121314"
      state-active-color: "#5fb8b1"
      state-icon-color: "#a3a4a1"
      state-climate-cool-color: "#5fb8b1"
      state-climate-dry-color: "#d1ae47"
      state-climate-fan_only-color: "#8fd3cd"
