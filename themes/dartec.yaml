---
# DarTec — the official DarTec Smart Homes theme for Home Assistant.
# Derived from the DarTec design tokens: teal primary, copper accent,
# warm ink/cream neutrals. Supports light and dark modes.
DarTec:
  # Shared identity
  primary-color: "#1a6b6b"
  accent-color: "#a8551f"
  dark-primary-color: "#0f4f4f"
  light-primary-color: "#e6f0f0"

  # Type
  primary-font-family: "'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "'IBM Plex Mono', ui-monospace, monospace"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"

  # Shape — tight radii, matching the DarTec system
  ha-card-border-radius: "8px"
  ha-dialog-border-radius: "10px"

  # State colors
  state-icon-color: "var(--primary-color)"
  paper-item-icon-active-color: "#a8551f"

  modes:
    light:
      primary-background-color: "#f5f5f0"      # dartec cream
      secondary-background-color: "#ebe9df"    # cream dim
      card-background-color: "#fffdf8"         # paper
      primary-text-color: "#22251f"            # ink
      secondary-text-color: "#52564c"          # ink soft
      disabled-text-color: "#666a5c"
      divider-color: "#ddd6c4"                 # accent soft
      ha-card-border-color: "#ddd6c4"
      primary-color: "#1a6b6b"
      accent-color: "#a8551f"
      state-active-color: "#1a6b6b"
      switch-checked-color: "#1a6b6b"
      slider-color: "#1a6b6b"
      slider-track-color: "#ddd6c4"
      label-badge-red: "#dc2626"
      error-color: "#dc2626"
      warning-color: "#d97706"
      success-color: "#047857"
      info-color: "#1a6b6b"
      table-row-background-color: "#fffdf8"
      table-row-alternative-background-color: "#f5f5f0"
      sidebar-background-color: "#fffdf8"
      sidebar-selected-icon-color: "#1a6b6b"
      sidebar-selected-text-color: "#1a6b6b"

    dark:
      primary-background-color: "#17181a"      # dartec dark ground
      secondary-background-color: "#212328"    # cream dim (dark)
      card-background-color: "#1e2024"         # paper (dark)
      primary-text-color: "#e8e6df"            # ink (dark)
      secondary-text-color: "#a8a79e"          # ink soft (dark)
      disabled-text-color: "#85857c"
      divider-color: "#3a3a38"
      ha-card-border-color: "#3a3a38"
      primary-color: "#4db3ac"                 # teal (dark)
      accent-color: "#e08b52"                  # copper (dark)
      state-active-color: "#4db3ac"
      state-icon-color: "#4db3ac"
      paper-item-icon-active-color: "#e08b52"
      switch-checked-color: "#4db3ac"
      slider-color: "#4db3ac"
      slider-track-color: "#3a3a38"
      label-badge-red: "#f87171"
      error-color: "#f87171"
      warning-color: "#fbbf24"
      success-color: "#34d399"
      info-color: "#4db3ac"
      table-row-background-color: "#1e2024"
      table-row-alternative-background-color: "#212328"
      sidebar-background-color: "#1e2024"
      sidebar-selected-icon-color: "#4db3ac"
      sidebar-selected-text-color: "#7fd0c9"
      code-editor-background-color: "#17181a"
